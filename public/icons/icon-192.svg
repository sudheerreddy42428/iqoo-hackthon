<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Pulse Ring -->
  <circle cx="96" cy="96" r="66" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- Shield Hexagon Contour -->
  <path d="M96 36 L144 60 V106 C144 136 96 156 96 156 C96 156 48 136 48 106 V60 Z" 
        fill="#090d16" stroke="url(#cyanGrad)" stroke-width="4" stroke-linejoin="round" />

  <!-- Code Bracket Left < -->
  <path d="M84 76 L68 96 L84 116" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Bracket Right > -->
  <path d="M108 76 L124 96 L108 116" fill="none" stroke="url(#purpleGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Crash/Playback Core -->
  <circle cx="96" cy="96" r="9" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="96" cy="96" r="4" fill="#ffffff" />
</svg>
