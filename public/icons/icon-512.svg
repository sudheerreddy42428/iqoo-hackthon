<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="purpleGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="20 14" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Shield Hexagon Contour -->
  <path d="M256 96 L384 160 V282 C384 362 256 416 256 416 C256 416 128 362 128 282 V160 Z" 
        fill="#090d16" stroke="url(#cyanGrad512)" stroke-width="10" stroke-linejoin="round" />

  <!-- Code Bracket Left < -->
  <path d="M224 202 L182 256 L224 310" fill="none" stroke="url(#cyanGrad512)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Bracket Right > -->
  <path d="M288 202 L330 256 L288 310" fill="none" stroke="url(#purpleGrad512)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Crash Core -->
  <circle cx="256" cy="256" r="24" fill="#f43f5e" filter="url(#glow512)" />
  <circle cx="256" cy="256" r="10" fill="#ffffff" />
</svg>
